[package]
name = "fr-files"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
asupersync.workspace = true
fr-core.workspace = true
fr-wire.workspace = true
serde_json.workspace = true
getrandom = "=0.4.3"

# iOS: the frd viewer stack (fr-mobile-ffi) links the session's file plane.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios", windows))'.dependencies]
fr-client.workspace = true
fr-transport.workspace = true
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

[lints]
workspace = true
