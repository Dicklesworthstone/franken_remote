[package]
name = "fr-native"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
fr-client = { workspace = true, optional = true }
fr-core.workspace = true
fr-media.workspace = true
fr-wire.workspace = true
frd = { workspace = true, optional = true }
asupersync = { workspace = true, optional = true }
fr-tailnet = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
fr-transport.workspace = true
fr-client.workspace = true
fr-wire.workspace = true
frd.workspace = true
asupersync.workspace = true
fr-tailnet.workspace = true

[features]
default = ["cli"]
macos-media = []
linux-media = []
# Opt-in read-only systemd/logind lifecycle evidence; no alternate runtime.
linux-logind = []
# Opt-in native libopus ABI; independent of HEVC, GUI and async dependencies.
linux-opus = []
# Wire-to-codec worker boundary; still no native audio-device or CLI dependency.
linux-audio-playout = ["linux-opus", "dep:fr-client"]
# Native local PulseAudio output, no alternate Rust runtime or default device.
linux-pulse-playback = ["linux-audio-playout"]
linux-displays = ["linux-media"]
linux-input = []
linux-clipboard = []
linux-session-ui = ["dep:frd"]
linux-viewer-input = ["dep:frd"]
linux-viewer-window = ["linux-viewer-input"]
cli = ["dep:asupersync", "dep:frd", "dep:fr-tailnet", "dep:fr-client"]
linux-desktop = ["cli", "linux-viewer-window"]
linux-input-agent = ["linux-input", "dep:frd", "dep:asupersync"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[example]]
name = "native_roundtrip"
required-features = ["linux-media"]

[[bin]]
name = "fr-media-worker"
path = "src/bin/media_worker.rs"
required-features = ["linux-media"]

[[bin]]
name = "fr"
path = "src/bin/fr.rs"
required-features = ["cli"]
