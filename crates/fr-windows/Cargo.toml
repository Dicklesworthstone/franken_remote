[package]
name = "fr-windows"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
# Windows targets embed the application manifest (visual styles, per-monitor
# DPI, asInvoker), icon and version resource; other targets do nothing.
build = "build.rs"

# The Windows client: installed Tailscale discovery and authenticated native
# connections through the shared session core (fr-mobile-ffi), driven from a
# Win32 window with Media Foundation decode and a D3D11 swap chain. Other
# platforms build a stub that says so. One library serves the command line
# and the windowed desktop application.
[lib]
path = "src/lib.rs"

[[bin]]
name = "fr-windows"
path = "src/main.rs"

# The desktop application installed for the user (Start menu, Apps & features).
[[bin]]
name = "FrankenRemote"
path = "src/app_main.rs"

[dependencies]
# Portable native text validation uses the protocol's one committed-text bound.
fr-core.workspace = true
# Clipboard completion and original-owner history are validated on every host.
fr-client.workspace = true
# Settings and completion summaries are parsed portably (already in the graph).
serde_json.workspace = true

[dev-dependencies]
# Run the actual shared approved-catalog selection on portable CI hosts.
fr-wire.workspace = true

[target.'cfg(windows)'.dependencies]
fr-mobile-ffi = { workspace = true, features = ["windows-session"] }
# `capture-probe`: the Windows host media path (Desktop Duplication into a
# hardware Media Foundation HEVC encoder), checked by this client's decoder.
fr-native = { workspace = true, default-features = false, features = ["windows-media", "windows-audio"] }
fr-media.workspace = true
fr-tailnet.workspace = true
# The window, swap chain and video processor (the version Cargo.lock
# already carries; only the bindings named below compile).
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# fr-windows is the Windows platform adapter (AGENTS.md 3.2): the Win32
# window, its message procedure and the D3D11/DXGI presentation are COM and
# Win32 FFI, so it opts out of the workspace's `unsafe_code = "forbid"`
# explicitly. Every unsafe block states its invariant (lint below); session,
# input policy and geometry are safe Rust.
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
