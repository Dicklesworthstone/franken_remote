[package]
name = "frd"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
[dependencies]
asupersync.workspace = true
fr-core.workspace = true
fr-media.workspace = true
fr-wire.workspace = true
serde_json.workspace = true
[lints]
workspace = true

[features]
# The viewer half of frd on macOS (fr-5a4w), for fr-native's macos-desktop
# client. Off by default: a default macOS build compiles what Linux-only frd
# compiled before, and the host half stays Linux-only until the macOS host.
macos-viewer = []
# The host half of frd on macOS (fr-p1-host-macos-vif): `frd run` with the
# macOS capture worker (fr-native macos-media). Off by default.
macos-host = []
# The viewer half of frd on Windows, for the Windows client. Off by default.
windows-viewer = []
windows-host = ["windows-viewer"]

# iOS compiles only the viewer half (`native_stack`, see build.rs) for
# fr-mobile-ffi; it has no host and no installed tailnet daemon.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios", windows))'.dependencies]
fr-client.workspace = true
fr-transport.workspace = true
fr-tailnet.workspace = true
fr-files.workspace = true
serde = { workspace = true, features = ["derive"] }
getrandom = "=0.4.3"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "event", "fs", "net", "process", "time", "termios"] }

# Reuse the cryptographic packages already in the pinned TLS/runtime graph.
ring = { version = "=0.17.14", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

# Win32 calls for the Windows host (policy store, clocks) stay in the FFI
# boundary crate.
[target.'cfg(windows)'.dependencies]
fr-winsys.workspace = true
