[package]
name = "fr-native"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
fr-core.workspace = true
fr-media.workspace = true

[dev-dependencies]
fr-wire.workspace = true

[features]
default = []
linux-media = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[example]]
name = "native_roundtrip"
required-features = ["linux-media"]

[[bin]]
name = "fr-media-worker"
path = "src/bin/media_worker.rs"
required-features = ["linux-media"]
