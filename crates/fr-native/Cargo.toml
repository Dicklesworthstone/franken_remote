[package]
name = "fr-native"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
fr-client = { workspace = true, optional = true }
fr-files = { workspace = true, optional = true }
fr-core.workspace = true
fr-media.workspace = true
fr-transport = { workspace = true, optional = true }
fr-wire.workspace = true
frd = { workspace = true, optional = true }
asupersync = { workspace = true, optional = true }
fr-tailnet = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The CLI's local profile store uses the same pinned safe filesystem adapter as frd.
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(windows)'.dependencies]
# Windows host capture (`windows-media`): Desktop Duplication, the D3D11 video
# processor and Media Foundation hardware encoders. The version Cargo.lock
# already carries for the Windows client; only the bindings named compile.
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
fr-transport.workspace = true
fr-client.workspace = true
fr-wire.workspace = true
frd.workspace = true
asupersync.workspace = true
fr-tailnet.workspace = true

[features]
default = ["cli"]
# The fr-media-worker binary; each platform feature below enables it.
media-worker = []
# macOS host capture (fr-p1-host-macos-vif): ScreenCaptureKit into
# VideoToolbox HEVC in the capture worker. System frameworks, macOS 14+ at runtime.
macos-media = ["media-worker"]
# Windows host capture (fr-p0-media-windows-fbt, fr-p2-host-windows-rt1):
# Desktop Duplication into a hardware Media Foundation HEVC encoder on the
# same adapter. System DLLs only.
windows-media = ["dep:windows"]
# fr-media-worker's Windows capture role around `windows-media`.
windows-host-media = ["media-worker", "windows-media"]
# Explicit host application/system playback capture. Reuses the separate
# media-worker audio role and the existing statically linked Opus encoder.
# No desktop client playback or microphone feature is enabled by this flag.
macos-host-audio = ["macos-media", "opus"]
# macOS client presentation (fr-5a4w): VideoToolbox HEVC decode into
# IOSurface-backed pixel buffers, drawn by Metal into a CAMetalLayer in an
# AppKit window. Objective-C glue compiled by build.rs; system frameworks only.
macos-desktop = ["cli", "dep:fr-files", "dep:fr-transport", "frd/macos-viewer", "macos-clipboard"]
# Explicit client playback: CoreAudio output and one supervised Opus child per
# epoch. Does not enable host capture or microphone forwarding.
macos-audio = ["macos-desktop", "macos-opus-process", "opus-playout"]
macos-opus-process = ["opus-process"]
# The per-lease input executor binary `fr-input-agent`; each platform's input
# feature enables it.
input-agent = []
# macOS host control (fr-macos-host-control-b14s): Quartz event injection and
# the AppKit control indicator in `fr-input-agent`. System frameworks only.
macos-input = ["input-agent", "macos-clipboard"]
# Shared synchronous NSPasteboard boundary; no viewer, codec or broker dependency.
macos-clipboard = []
linux-media = ["media-worker"]
# Opt-in read-only systemd/logind lifecycle evidence; no alternate runtime.
linux-logind = []
# The read-only inherited-pipe monitor binary, shared by platform adapters.
session-monitor = ["dep:frd"]
linux-session-monitor = ["linux-logind", "session-monitor"]
# Console identity, switch/logout and sleep evidence, not a screen-lock oracle.
macos-session-monitor = ["session-monitor", "frd/macos-host"]
# Read-only local Stop sharing surface. The platform features supply its UI.
observation-indicator = []
macos-observation-indicator = ["observation-indicator"]
linux-session-events = ["linux-logind", "dep:frd", "dep:asupersync"]
# Opt-in native libopus ABI; independent of HEVC, GUI and async dependencies.
opus = []
opus-process = ["opus", "dep:fr-client"]
opus-playout = ["opus", "dep:fr-client"]
linux-opus = ["opus"]
# Wire-to-codec worker boundary; still no native audio-device or CLI dependency.
linux-audio-playout = ["linux-opus", "opus-playout"]
# Native local PulseAudio output, no alternate Rust runtime or default device.
linux-pulse-playback = ["linux-audio-playout"]
# Explicit named client recording source; permission-gated worker API only.
linux-microphone-capture = ["linux-pulse-playback"]
# Per-session, explicitly selected microphone capture in a supervised child.
linux-microphone-process = ["linux-microphone-capture"]
# Original authenticated uplink, independent of public CLI capability offers.
linux-microphone-uplink = ["linux-microphone-process", "dep:fr-transport", "dep:asupersync"]
# Original ControlledViewer scheduling and visible local consent API.
linux-microphone-session = ["linux-microphone-uplink", "dep:frd"]
# Public controlled-client talk/mute UI, separate from the library-only boundary.
linux-microphone = ["linux-microphone-session", "linux-session-ui"]
# Explicit native virtual source; no CLI/GUI, capture, runtime or default enable.
linux-pipewire-mic = []
# Bound uplink Opus, isolated decoding and actual virtual-source graph demand.
linux-microphone-playout = ["linux-pipewire-mic", "linux-audio-playout", "linux-opus-process"]
# Host playback audio end to end: the worker's PulseAudio monitor-record +
# Opus-encode role and `fr connect --audio` playback. Same libpulse/libopus
# SONAMEs as above; frd itself never enables this feature or links either.
linux-opus-process = ["linux-opus", "opus-process"]
linux-audio = ["linux-pulse-playback", "linux-opus-process"]
linux-displays = ["linux-media"]
linux-input = ["input-agent", "observation-indicator"]
# Exact RandR monitor input targets, without the media/FFmpeg worker boundary.
linux-input-monitors = ["linux-input"]
linux-clipboard = []
linux-session-ui = ["dep:frd", "dep:asupersync", "observation-indicator"]
# Original Host consent on one locally selected, logind-guarded X11 desktop.
linux-local-approval = ["linux-session-ui", "linux-logind"]
linux-viewer-input = ["dep:frd"]
linux-viewer-window = ["linux-viewer-input"]
cli = ["dep:asupersync", "dep:frd", "dep:fr-tailnet", "dep:fr-client"]
linux-desktop = ["cli", "linux-viewer-window", "dep:fr-files", "dep:fr-transport"]
linux-input-agent = ["linux-input-monitors", "dep:frd", "dep:asupersync"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# fr-native is a named FFI boundary crate (AGENTS.md 3.2): it holds the X11,
# XTest, XFixes/DAMAGE/RandR, FFmpeg bridge, PulseAudio, libopus, seccomp and
# sd-bus bindings, so it opts out of the workspace's `unsafe_code = "forbid"`
# explicitly. Every unsafe block states its invariant (lint below).
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[example]]
name = "native_roundtrip"
required-features = ["linux-media"]

[[example]]
name = "macos_present"
required-features = ["macos-desktop"]

[[bin]]
name = "fr-media-worker"
path = "src/bin/media_worker.rs"
required-features = ["media-worker"]

[[bin]]
name = "fr"
path = "src/bin/fr.rs"
required-features = ["cli"]

[[bin]]
name = "fr-session-monitor"
path = "src/bin/session_monitor.rs"
required-features = ["session-monitor"]

# Per-lease input injection executor launched by frd (frd never loads Xlib
# or posts Quartz events itself).
[[bin]]
name = "fr-input-agent"
path = "src/bin/input_agent.rs"
required-features = ["input-agent"]

# Reads the macOS input owner's real events back through a per-process event
# tap; its own main, since AppKit registration must run on the main thread.
[[test]]
name = "macos_input_events"
harness = false
required-features = ["macos-input"]

# Read-only observation UI child; shares the indicator binding, not input authority.
[[bin]]
name = "fr-observation-indicator"
path = "src/bin/observation_indicator.rs"
required-features = ["observation-indicator"]

# Host-provided Opus is decoded only in this restricted, per-epoch child.
[[bin]]
name = "fr-opus-worker"
path = "src/bin/opus_worker.rs"
required-features = ["opus-process"]

# Explicit microphone RECORD/Opus worker; independent of HEVC and CLI/runtime.
[[bin]]
name = "fr-audio-worker"
path = "src/bin/audio_worker.rs"
required-features = ["linux-microphone-process"]

# Host virtual microphone device; its containing supervisor owns the Opus sibling.
[[bin]]
name = "fr-microphone-worker"
path = "src/bin/microphone_worker.rs"
required-features = ["linux-microphone-playout"]
