[package]
name = "fr-winsys"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

# The Win32 boundary below fr-native: safe wrappers for the safe-Rust crates
# that need Windows system calls (fr-tailnet's LocalAPI pipe and its ingress
# check's interface reads). Other platforms compile an empty crate.
[target.'cfg(windows)'.dependencies]
# The version Cargo.lock already carries for fr-windows and fr-native.
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }

[features]
# Existing host/client consumers retain their complete Windows boundary.
default = ["full"]
# Isolated codec workers need trusted image admission without GUI/input APIs.
protected-files = [
    "windows/Wdk_Foundation",
    "windows/Wdk_Storage_FileSystem",
    "windows/Win32_Foundation",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Storage_FileSystem",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
    "windows/Win32_System_Threading",
]
full = [
    "protected-files",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Media",
    "windows/Win32_NetworkManagement_IpHelper",
    "windows/Win32_NetworkManagement_Ndis",
    "windows/Win32_Networking_WinSock",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_DataExchange",
    "windows/Win32_System_LibraryLoader",
    "windows/Win32_System_Memory",
    "windows/Win32_System_RemoteDesktop",
    "windows/Win32_System_StationsAndDesktops",
    "windows/Win32_System_SystemInformation",
    "windows/Win32_System_WindowsProgramming",
    "windows/Win32_UI_HiDpi",
    "windows/Win32_UI_Input_KeyboardAndMouse",
    "windows/Win32_UI_Shell",
    "windows/Win32_UI_WindowsAndMessaging",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# fr-winsys is a named FFI boundary crate (AGENTS.md 3.2): it exists so the
# Win32 calls under fr-tailnet and frd live outside those
# `forbid(unsafe_code)` crates, so it opts out of the workspace's
# `unsafe_code = "forbid"` explicitly. Every unsafe block states its
# invariant (lint below).
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
