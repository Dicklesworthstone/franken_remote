[package]
name = "fr-tailnet"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# The trust-root reader is platform neutral. Installed identity uses the
# daemon's Unix-socket LocalAPI (Linux; macOS open-source tailscaled) or the
# macOS standalone app's loopback LocalAPI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { workspace = true, features = ["tls"] }
# Kernel entropy for QUIC connection IDs on every OS (Windows has no
# /dev/urandom); the same pinned version frd and fr-files use.
getrandom = "=0.4.3"

# macOS only: the safe LOCAL_PEERPID getsockopt binding, the Unix-socket
# daemon's kernel-reported PID (Asupersync's getpeereid carries no PID). The
# exact version and a subset of the features Asupersync already builds on
# this target, so no crate or feature enters the graph.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket"] }

# Windows: tailscaled's named-pipe LocalAPI, through the Win32 boundary
# crate (this crate forbids unsafe code).
[target.'cfg(windows)'.dependencies]
fr-winsys.workspace = true

[lints]
workspace = true
