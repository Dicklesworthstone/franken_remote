# FrankenRemote workspace.
# Crates enter only with a real vertical slice; no placeholder crates.
# Every directory under crates/ is a workspace member via the glob, so it MUST
# be a complete crate: a directory there without a Cargo.toml breaks every
# cargo command for every agent in the checkout, immediately. Create new
# crates ALL AT ONCE (manifest + src/lib.rs + the [workspace.dependencies]
# path entry below in the same commit), per AGENTS.md section 8.1.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/franken_remote"

[workspace.dependencies]
# The sole async runtime (AGENTS.md section 3.1). Pinned here so every
# consumer inherits one version; default-features off because FrankenRemote
# enables only the Asupersync features it qualifies (plan section 4.1).
# Pinned to an immutable upstream Git revision, never the mutable sibling
# checkout. Published 0.5.0 sends each TLS handshake segment as ONE datagram,
# so a real Tailscale (Let's Encrypt) certificate chain (~3.6 KB flight) can
# never complete a live handshake; 82b3e34b3 (on asupersync main since
# 2026-10-09) splits Handshake-level CRYPTO into packet-sized datagrams.
# 079214d3f (asupersync main, 2026-11-11; previously ee72b665e) adds three FR
# transport fixes: accept_with_initial (the host's cold accept no longer waits
# out the client's 1.5 s handshake PTO), a plain ACK for window-update-only
# packets (idle peers stop answering each other's ACKs), and a typed
# ServerCertificateRejected for a refused server certificate.
# becc05376 (asupersync main, 2026-11-11) adds the kqueue reactor on iOS, so
# the iOS build no longer needs a patched copy.
# Owner approval for a Git pin while 0.6.x is unpublished: 2026-10-12
# ("do everything you think is advisable"). Return to a crates.io release
# once one contains these fixes. Selecting this revision does not qualify transport.
asupersync = { version = "=0.6.2", git = "https://github.com/Dicklesworthstone/asupersync.git", rev = "becc0537626632a40ae5529a2a0bdf9807fd971f", default-features = false }
# First-party crates, wired by path in exactly one place; consumers write
# `fr-core.workspace = true`.
fr-core = { path = "crates/fr-core" }
fr-files = { path = "crates/fr-files" }
fr-lab = { path = "crates/fr-lab" }
fr-media = { path = "crates/fr-media" }
fr-wire = { path = "crates/fr-wire" }
fr-tailnet = { path = "crates/fr-tailnet" }
serde = "1"
serde_json = "1"
fr-transport = { path = "crates/fr-transport" }
fr-native = { path = "crates/fr-native" }
frd = { path = "crates/frd" }
fr-client = { path = "crates/fr-client" }
fr-mobile-ffi = { path = "crates/fr-mobile-ffi" }

[workspace.lints.rust]
# Protocol/policy/authority code is safe Rust (AGENTS.md section 3.2). The
# named FFI boundary crates (fr-native, platform adapters) opt out of this
# single lint deliberately and document why; nothing else may.
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Error/panic doc sections are written where they carry real content, not as
# lint appeasement.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Domain types repeat the crate's nouns deliberately (limits::LimitsError).
module_name_repetitions = "allow"
# must_use is applied where misuse is a real bug, not everywhere it fits.
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
