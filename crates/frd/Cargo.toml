[package]
name = "frd"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
[dependencies]
asupersync.workspace = true
fr-core.workspace = true
fr-media.workspace = true
fr-wire.workspace = true
serde_json.workspace = true
[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fr-client.workspace = true
fr-transport.workspace = true
fr-tailnet.workspace = true
fr-files.workspace = true
serde = { workspace = true, features = ["derive"] }
getrandom = "=0.4.3"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process"] }

# Reuse the cryptographic packages already in the pinned TLS/runtime graph.
ring = { version = "=0.17.14", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
