[package]
name = "fr-tailnet"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# The trust-root reader is platform neutral. Installed outbound identity uses
# the Linux LocalAPI or the authenticated macOS app; host admission stays Linux.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { workspace = true, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
fr-tailnet-platform.workspace = true

[lints]
workspace = true
