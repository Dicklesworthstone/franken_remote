[package]
name = "fr-winsys"
version = "0.1.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

# The Win32 boundary below fr-native: safe wrappers for the safe-Rust crates
# that need Windows system calls (fr-tailnet's LocalAPI pipe and its ingress
# check's interface reads). Other platforms compile an empty crate.
[target.'cfg(windows)'.dependencies]
# The version Cargo.lock already carries for fr-windows and fr-native.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# fr-winsys is a named FFI boundary crate (AGENTS.md 3.2): it exists so the
# Win32 calls under fr-tailnet and frd live outside those
# `forbid(unsafe_code)` crates, so it opts out of the workspace's
# `unsafe_code = "forbid"` explicitly. Every unsafe block states its
# invariant (lint below).
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
